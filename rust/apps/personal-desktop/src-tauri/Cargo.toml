[package]
name = "clipsync-personal-tauri"
version = "0.1.0"
edition = "2021"
description = "ClipSync Personal — Tauri 2 desktop shell"
publish = false

[lib]
name = "clipsync_personal_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "clipsync-personal-tauri"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
clipsync-protocol = { path = "../../../crates/clipsync-protocol" }
clipsync-transport = { path = "../../../crates/clipsync-transport" }
mdns-sd = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hostname = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
