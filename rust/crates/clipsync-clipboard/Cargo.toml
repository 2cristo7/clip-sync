[package]
name = "clipsync-clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
clipsync-protocol = { path = "../clipsync-protocol" }
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
notify-rust = "4"
thiserror = "2"
tracing = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }

[dev-dependencies]
