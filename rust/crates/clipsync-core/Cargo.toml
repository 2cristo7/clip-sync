[package]
name = "clipsync-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.16"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.11"
arboard = { version = "3", features = ["image-data"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
data-encoding = "2"
png = "0.18"
pem = "3"
dirs = "6"
time = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
notify-rust = "4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
