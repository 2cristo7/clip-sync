[workspace]
resolver = "2"
members = [
    # New focused crates (Phase 1.9 split).
    "crates/clipsync-protocol",
    "crates/clipsync-crypto",
    "crates/clipsync-transport",
    "crates/clipsync-clipboard",
    "crates/clipsync-platform",
    # Enterprise policy engine (Phase 2.4).
    "crates/clipsync-policy",
    # Enterprise storage crate (Phase 2.2).
    "crates/clipsync-storage",
    # Enterprise binary crate (Phase 2.1).
    "apps/enterprise-server",
    # Legacy crates kept as transitional re-export shells until the
    # `apps/` desktop shells land. Source moved physically under
    # `legacy/` to make their pending removal obvious.
    "legacy/clipsync-core",
    "legacy/clipsync-server",
    "legacy/clipsync-client",
]
