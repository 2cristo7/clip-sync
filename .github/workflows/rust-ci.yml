name: Rust CI

on:
  push:
    branches: [main, dev]
    paths: ['rust/**']
  pull_request:
    paths: ['rust/**']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core-tests:
    name: Core Library Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Clippy
        run: cargo clippy -p clipsync-core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p clipsync-core

  build:
    name: Build ${{ matrix.crate }} (${{ matrix.os }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crate: [clipsync-server, clipsync-client]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Clippy
        run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings

      - name: Test
        run: cargo test -p ${{ matrix.crate }}

      - name: Build release
        run: cargo build -p ${{ matrix.crate }} --release

      - name: Upload binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ matrix.os }}
          path: |
            rust/target/release/clipsync-server
            rust/target/release/clipsync-client
          if-no-files-found: ignore

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.crate }}-${{ matrix.os }}
          path: |
            rust/target/release/clipsync-server.exe
            rust/target/release/clipsync-client.exe
          if-no-files-found: ignore
