name: CI Enterprise

on:
  push:
    branches:
      - product/enterprise
      - 'feat/enterprise-**'
      - 'chore/enterprise-**'
      - 'test/enterprise-**'
      - 'docs/enterprise-**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/screenshots/**'
      - '*.png'
  pull_request:
    branches: [product/enterprise]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/screenshots/**'
      - '*.png'

concurrency:
  group: ci-enterprise-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Format check
        run: cargo fmt --all --check --manifest-path rust/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Cache npm (desktop)
        uses: actions/cache@v4
        with:
          path: rust/apps/enterprise-desktop/frontend/node_modules
          key: npm-desktop-${{ hashFiles('rust/apps/enterprise-desktop/frontend/package-lock.json') }}

      - name: Frontend lint (desktop)
        run: |
          cd rust/apps/enterprise-desktop/frontend
          npm ci
          npm run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm (desktop)
        uses: actions/cache@v4
        with:
          path: rust/apps/enterprise-desktop/frontend/node_modules
          key: npm-desktop-${{ hashFiles('rust/apps/enterprise-desktop/frontend/package-lock.json') }}

      - name: Cache npm (client)
        uses: actions/cache@v4
        with:
          path: rust/apps/enterprise-client/frontend/node_modules
          key: npm-client-${{ hashFiles('rust/apps/enterprise-client/frontend/package-lock.json') }}

      - name: Build desktop frontend
        run: |
          cd rust/apps/enterprise-desktop/frontend
          npm ci
          npm run build

      - name: Build client frontend
        run: |
          cd rust/apps/enterprise-client/frontend
          npm ci
          npm run build
