name: CI Personal

on:
  push:
    branches:
      - product/personal
      - 'feat/personal-**'
      - 'chore/personal-**'
      - 'test/personal-**'
      - 'docs/personal-**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/screenshots/**'
      - '*.png'
  pull_request:
    branches: [product/personal]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/screenshots/**'
      - '*.png'

concurrency:
  group: ci-personal-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Nextest
        run: cargo nextest run --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/apps/personal-desktop/frontend/package-lock.json

      - name: Frontend lint & typecheck
        working-directory: rust/apps/personal-desktop/frontend
        run: |
          npm ci
          npm run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/apps/personal-desktop/frontend/package-lock.json

      - name: Build Vite production bundle
        working-directory: rust/apps/personal-desktop/frontend
        run: |
          npm ci
          npm run build
